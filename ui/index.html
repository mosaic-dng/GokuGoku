<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>水分補給課</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero { display: flex; align-items: center; gap: 18px; min-height: 174px; padding: 20px 22px 18px; }
  #mascotBox { flex: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #mascot { display: block; filter: drop-shadow(0 6px 8px rgba(17, 168, 155, 0.25)); animation: floaty 3.4s ease-in-out infinite; }
  #mascotBox.boing #mascot { animation: boing 0.5s var(--ease); }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes boing {
    0% { transform: scale(1); }
    30% { transform: scale(1.14, 0.82) translateY(6px); }
    60% { transform: scale(0.92, 1.1) translateY(-5px); }
    100% { transform: scale(1); }
  }
  .bubble {
    position: relative; min-height: 88px;
    display: flex; align-items: center;
    padding: 15px 17px;
    background: #fffdf4; border: 2px solid #e8dfc6; border-radius: 20px;
    font-size: 16px; line-height: 1.65; color: var(--text); font-weight: 650;
  }
  .bubble::before {
    content: ''; position: absolute; left: -8px; top: 50%;
    width: 12px; height: 12px; margin-top: -6px;
    background: #fffdf4; border-left: 2px solid #e8dfc6; border-bottom: 2px solid #e8dfc6;
    transform: rotate(45deg); border-radius: 0 0 0 3px;
  }

  .stats .toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .stats .label { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: 0.04em; }
  .stats .count { font-size: 17px; color: var(--sub); font-weight: 700; text-align: right; }
  .stats .count b { font-size: 30px; color: var(--mint-lo); font-weight: 900; margin-right: 3px; }
  .cups { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; min-height: 38px; }
  .cups svg { transition: transform 0.25s var(--ease); }
  .cups svg.pop { animation: cuppop 0.45s var(--ease); }
  @keyframes cuppop { 0% { transform: scale(0.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .progress-track {
    height: 8px; margin: 0; overflow: hidden;
    border-radius: 999px; background: var(--panel-2);
  }
  .progress-fill {
    width: 0; height: 100%; border-radius: inherit; background: var(--mint);
    transition: width .3s var(--ease);
  }
  .count-bump { animation: countBump .38s var(--ease); }
  @keyframes countBump {
    0%, 100% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
  .timerline {
    display: flex; align-items: center; gap: 8px;
    padding-top: 13px; border-top: 2px dashed var(--panel-2);
    font-size: 15px; color: var(--sub); font-weight: 700;
  }
  .timerline .dotpulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--mint); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
  .timerline b { color: var(--ink); font-weight: 900; font-variant-numeric: tabular-nums; }

  .collapse-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 3px 0; background: none; border: none; cursor: pointer;
    font-family: var(--font); font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: 0.04em;
  }
  .collapse-head .arrow {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 50%; background: var(--mint); color: #fff; font-size: 13px;
    transition: transform 0.3s var(--ease);
  }
  .settings.open .collapse-head .arrow { transform: rotate(180deg); }
  .collapse-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s var(--ease); }
  .settings.open .collapse-body { grid-template-rows: 1fr; }
  .collapse-inner { overflow: hidden; }
  .field {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 15px 0; border-bottom: 2px dashed var(--panel-2);
  }
  .field.col { flex-direction: column; align-items: stretch; gap: 8px; }
  .field:last-child { border-bottom: none; }
  .field .fname { font-size: 15px; font-weight: 800; color: var(--text); flex: none; }
  .field-tools { display: flex; align-items: center; gap: 7px; }
  .worktime { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .worktime input { width: 128px; }
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mini-label { display: grid; gap: 6px; font-size: 12px; color: var(--sub); font-weight: 800; }
  .mini-label.full { grid-column: 1 / -1; }
  .mini-label input { width: 100%; }
  .numeric-setting { width: 128px; }
  .summary-strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 11px; border-radius: 17px; background: #fff9df; border: 2px solid #eddc93;
  }
  .summary-strip span { text-align: center; font-size: 11px; color: #9b7b34; font-weight: 800; }
  .summary-strip b { display: block; color: var(--ink); font-size: 15px; margin-top: 3px; }
  .save-profile { width: 100%; height: 48px; margin-top: 9px; }
  .reset-today {
    height: 38px; padding: 0 16px;
    border: 2px solid #e58a78; border-radius: 999px;
    background: #fffdf4; color: var(--danger);
    font: 800 13px var(--font); cursor: pointer;
    transition: all .15s var(--ease);
  }
  .reset-today:hover { background: var(--danger); color: #fff; }

  .dnd-list { display: grid; gap: 9px; }
  .dnd-row { display: grid; grid-template-columns: 1fr auto 1fr 32px; gap: 7px; align-items: center; }
  .dnd-row input { min-width: 0; width: 100%; padding: 0 7px; }
  .dnd-row span { font-size: 13px; color: var(--faint); font-weight: 900; }
  .remove-range {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--faint);
    background: #fffdf4; color: var(--danger); font: 900 15px var(--font); cursor: pointer;
  }
  .add-range {
    justify-self: start; border: none; background: none; color: var(--mint-lo);
    font: 800 13px var(--font); cursor: pointer; padding: 3px 0;
  }
  .inline-error { min-height: 18px; color: var(--danger); font-size: 12px; font-weight: 800; }
  .drinkwrap { padding: 0 2px; }

  .footer {
    flex: none; position: relative; text-align: center;
    padding: 16px 0 13px; font-size: 12px; color: var(--faint); font-weight: 700; letter-spacing: 0.08em;
  }

  #toast {
    position: absolute; left: 50%; bottom: 104px; z-index: 30;
    transform: translateX(-50%) translateY(16px);
    display: flex; align-items: center; gap: 10px; max-width: 345px;
    padding: 13px 15px 13px 19px;
    background: #fffdf4; border: 2px solid var(--mint); border-radius: 20px;
    box-shadow: 0 8px 24px rgba(61, 52, 40, 0.18);
    font-size: 14px; font-weight: 700; line-height: 1.45;
    opacity: 0; pointer-events: none; transition: all 0.25s var(--ease);
  }
  #toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #toast.gold { border-color: var(--yellow); background: #fffbe7; }
  #toastAction {
    display: none; flex: none; border: none; border-radius: 999px; padding: 6px 10px;
    background: var(--orange); color: #fff; font: 900 13px var(--font); cursor: pointer;
  }
  #toast.has-action #toastAction { display: block; }
  .btn:disabled, .tiny-btn:disabled { cursor: default; opacity: .58; transform: none; }

  .setup-overlay {
    position: absolute; inset: 64px 0 0; z-index: 20; display: none;
    padding: 16px 24px 22px; overflow: hidden;
    background:
      linear-gradient(rgba(248,248,240,.95), rgba(248,248,240,.98)),
      radial-gradient(circle, rgba(25,200,185,.17) 3px, transparent 3px);
    background-size: auto, 22px 22px;
  }
  .setup-overlay.show { display: block; animation: setupIn .35s var(--ease); }
  @keyframes setupIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .setup-card {
    position: relative; height: 100%; padding: 23px 24px 18px; overflow: hidden;
    border: 2px solid #decf9e; border-radius: 28px; background: #fff9df;
    box-shadow: 0 8px 22px rgba(121,79,39,.18);
  }
  .setup-card::after {
    content: '入 課 届'; position: absolute; top: 18px; right: -31px;
    width: 112px; padding: 4px 0; transform: rotate(38deg);
    background: var(--mint); color: white; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: 3px;
  }
  .setup-card h1 { margin: 3px 0 14px; color: var(--ink); font-size: 28px; line-height: 1.22; }
  .setup-pane { transition: opacity .28s var(--ease), transform .28s var(--ease); }
  .setup-finish-pane { margin-top: 14px; }
  .setup-work { margin-top: 14px; }
  .setup-work h2 { margin-bottom: 9px; color: var(--ink); font-size: 15px; }
  .setup-work .worktime input { flex: 1; width: auto; }
  .setup-section { margin-top: 0; }
  .setup-section h2 { margin-bottom: 10px; color: var(--ink); font-size: 15px; }
  .setup-preview {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 16px 0;
  }
  .setup-preview div {
    padding: 12px 9px; border: 2px solid #e8dba8; border-radius: 16px; background: #fffdf4;
    color: var(--sub); text-align: center; font-size: 11px; font-weight: 800;
  }
  .setup-preview b { display: block; margin-top: 3px; color: var(--mint-lo); font-size: 18px; }
  .setup-submit { width: 100%; height: 58px; margin-top: 5px; font-size: 18px; }
  .setup-step-label, .setup-next, .setup-back { display: none; }
  .setup-actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .disclaimer { margin: 12px 3px 0; color: var(--faint); font-size: 11px; line-height: 1.55; text-align: center; font-weight: 700; }

  .setup-overlay.compact { padding: 12px 24px 16px; }
  .setup-overlay.compact .setup-card { padding-top: 20px; }
  .setup-overlay.compact .setup-step-label {
    display: block; margin: -3px 0 12px; color: var(--mint-lo);
    font-size: 12px; font-weight: 900; letter-spacing: .08em;
  }
  .setup-overlay.compact .setup-pane { display: none; }
  .setup-overlay.compact .setup-card[data-step="1"] .setup-profile-pane,
  .setup-overlay.compact .setup-card[data-step="2"] .setup-finish-pane { display: block; }
  .setup-overlay.compact .setup-finish-pane { margin-top: 0; }
  .setup-overlay.compact .setup-next,
  .setup-overlay.compact .setup-back { display: inline-flex; }
  .setup-overlay.compact .setup-next { width: 100%; height: 56px; margin-top: 18px; font-size: 17px; }
  .setup-overlay.compact .setup-actions { grid-template-columns: 108px 1fr; }
  .setup-overlay.compact .setup-back { height: 58px; margin-top: 5px; }
  .setup-overlay.compact .setup-card[data-step="1"] .disclaimer { display: none; }

  .ui-ready .content > * { animation: contentIn .32s var(--ease) both; }
  .ui-ready .content > *:nth-child(2) { animation-delay: .08s; }
  .ui-ready .content > *:nth-child(3) { animation-delay: .16s; }
  .ui-ready .content > *:nth-child(4) { animation-delay: .24s; }
  .setup-overlay.show .setup-card h1,
  .setup-overlay.show .setup-profile-pane,
  .setup-overlay.show .setup-finish-pane,
  .setup-overlay.show .disclaimer { animation: contentIn .32s var(--ease) both; }
  .setup-overlay.show .setup-profile-pane { animation-delay: .08s; }
  .setup-overlay.show .setup-finish-pane { animation-delay: .16s; }
  .setup-overlay.show .disclaimer { animation-delay: .24s; }
  @keyframes contentIn {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    #mascot, .dotpulse { animation: none !important; }
    .ui-ready .content > *, .setup-overlay.show * { transform: none !important; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="brand">
      <img src="../assets/app.png" alt="">
      <div class="name">水分補給課<small>SUIBUN HOKYU DIV.</small></div>
    </div>
    <div class="winbtns">
      <button id="btnMin" title="最小化">−</button>
      <button id="btnHide" class="close" title="缩进托盘继续潜伏">×</button>
    </div>
  </div>

  <main class="content">
    <section class="card pattern hero">
      <div id="mascotBox" title="戳一下">
        <svg id="mascot" viewBox="0 0 120 120" width="138" height="138">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5fdfd2"/>
              <stop offset="1" stop-color="#0fa295"/>
            </linearGradient>
          </defs>
          <path d="M60,8 C66,24 94,50 94,72 A34,34 0 1,1 26,72 C26,50 54,24 60,8 Z"
                fill="url(#g)" stroke="#fffdf4" stroke-width="5" stroke-linejoin="round"/>
          <ellipse cx="46" cy="58" rx="7" ry="11" fill="#fff" opacity="0.9" transform="rotate(-14 46 58)"/>
          <circle cx="74" cy="92" r="3.6" fill="#fff" opacity="0.35"/>
          <g class="face f-normal">
            <circle cx="48" cy="76" r="3.6" fill="#4a3a28"/><circle cx="72" cy="76" r="3.6" fill="#4a3a28"/>
            <path d="M53,84 Q60,90 67,84" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="39" cy="83" r="4.6" fill="#f8a6b2" opacity="0.75"/><circle cx="81" cy="83" r="4.6" fill="#f8a6b2" opacity="0.75"/>
          </g>
          <g class="face f-happy" style="display:none">
            <path d="M43,77 q5,-7 10,0M67,77 q5,-7 10,0" stroke="#4a3a28" stroke-width="3.2" fill="none" stroke-linecap="round"/>
            <path d="M52,83 q8,11 16,0 z" fill="#5f4630"/>
            <circle cx="38" cy="84" r="4.8" fill="#f8a6b2"/><circle cx="82" cy="84" r="4.8" fill="#f8a6b2"/>
          </g>
          <g class="face f-thirsty" style="display:none">
            <path d="M44,76 h8M68,76 h8" stroke="#4a3a28" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M52,86 q4,-4 8,0 q4,4 8,0" stroke="#4a3a28" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M92,60 c3,5 7,9 7,13 a7,7 0 1,1 -14,0 c0,-4 4,-8 7,-13 z" fill="#889df0"/>
          </g>
        </svg>
      </div>
      <div class="bubble"><span id="quote">……</span></div>
    </section>

    <section class="card stats">
      <div class="toprow">
        <div>
          <div class="label">今日の水分</div>
          <div class="tag hot" id="title" style="margin-top:6px">干燥注意报</div>
        </div>
        <div class="count"><b id="cupNum">0</b>/<span id="goalNum">5</span> 杯</div>
      </div>
      <div class="cups" id="cups"></div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar" role="progressbar" aria-label="今日饮水进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
      <div class="timerline">
        <div class="dotpulse" id="pulse"></div>
        <span id="timerLabel">距离下次催水还有</span><b id="timerVal"></b>
      </div>
    </section>

    <div class="drinkwrap">
      <button class="btn btn-primary big" id="drinkBtn">喝了喝了！（+200ml）</button>
    </div>

    <section class="card settings" id="settings">
      <button class="collapse-head" id="collapseHead">
        <span>⚙ 课内设定</span><span class="arrow">▼</span>
      </button>
      <div class="collapse-body">
        <div class="collapse-inner">
          <div class="field col">
            <div class="fname">个人补水档案</div>
            <div class="profile-grid">
              <label class="mini-label">体重（kg）<input id="weightInput" type="number" inputmode="decimal" min="30" max="300" step="0.1"></label>
              <label class="mini-label">每次喝水量（ml）<input id="cupInput" type="number" inputmode="numeric" min="50" max="1000" step="10"></label>
            </div>
            <div class="summary-strip">
              <span>全天参考<b id="sumDaily">—</b></span>
              <span>上班目标<b id="sumWork">—</b></span>
              <span>当前进度<b id="sumCups">—</b></span>
            </div>
          </div>

          <div class="field">
            <div class="fname">催水间隔（分钟）</div>
            <input class="numeric-setting" id="intervalInput" type="number" inputmode="numeric" min="1" max="1440" step="1" aria-label="催水间隔（分钟）">
          </div>

          <div class="field">
            <div class="fname">上班时间</div>
            <div class="worktime"><input id="selStart" type="time" step="60" aria-label="上班开始时间"><span>—</span><input id="selEnd" type="time" step="60" aria-label="上班结束时间"></div>
          </div>

          <div class="field col">
            <div class="fname">每日免打扰</div>
            <div class="dnd-list" id="settingsDnd"></div>
            <button class="add-range" id="settingsAddDnd">＋ 添加免打扰时段</button>
            <div class="inline-error" id="settingsError"></div>
            <button class="btn btn-ghost save-profile" id="saveProfileBtn">保存个人设定</button>
          </div>

          <div class="field">
            <div class="fname">喝水＋起身</div>
            <button class="switch" id="swSedentary" type="button" aria-label="喝水加起身提醒" aria-pressed="false"></button>
          </div>
          <div class="field">
            <div class="fname">周末也催</div>
            <button class="switch" id="swWeekend" type="button" aria-label="周末催水" aria-pressed="false"></button>
          </div>
          <div class="field">
            <div class="fname">课内音效</div>
            <button class="switch" id="swSound" type="button" aria-label="课内音效" aria-pressed="false"></button>
          </div>
          <div class="field">
            <div class="fname">开机自动潜伏</div>
            <button class="switch" id="swAuto" type="button" aria-label="开机自动启动" aria-pressed="false"></button>
          </div>
          <div class="field reset-field">
            <div class="fname">今日饮水记录</div>
            <button class="reset-today" id="resetTodayBtn">重置今日记录</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    本课对口渴负全部责任 · © 水分補給課
  </footer>

  <div id="toast"><span id="toastText"></span><button id="toastAction">撤销</button></div>

  <section class="setup-overlay" id="onboarding" aria-modal="true">
    <div class="setup-card" data-step="1">
      <h1>先量身定做一份<br>喝水课表吧</h1>
      <div class="setup-step-label" id="setupStepLabel">第 1 步 · 个人课表</div>

      <div class="setup-pane setup-profile-pane" data-step="1">
        <div class="profile-grid">
          <label class="mini-label">你的体重（kg）<input id="setupWeight" type="number" inputmode="decimal" min="30" max="300" step="0.1" value="60"></label>
          <label class="mini-label">每次喝水量（ml）<input id="setupCup" type="number" inputmode="numeric" min="50" max="1000" step="10" value="200"></label>
          <label class="mini-label full">催水间隔（分钟）<input id="setupInterval" type="number" inputmode="numeric" min="1" max="1440" step="1" value="45"></label>
        </div>
        <div class="setup-work">
          <h2>🕘 上下班时间</h2>
          <div class="worktime">
            <input id="setupStart" type="time" step="60" value="09:00" aria-label="首次设置上班开始时间">
            <span>—</span>
            <input id="setupEnd" type="time" step="60" value="18:00" aria-label="首次设置上班结束时间">
          </div>
        </div>
        <div class="inline-error" id="setupProfileError"></div>
        <button class="btn btn-primary setup-next" id="setupNext">下一步</button>
      </div>

      <div class="setup-pane setup-finish-pane" data-step="2">
        <div class="setup-section">
          <h2>🔕 午休或会议免打扰</h2>
          <div class="dnd-list" id="setupDnd"></div>
          <button class="add-range" id="setupAddDnd">＋ 再加一个时段</button>
        </div>

        <div class="setup-preview">
          <div>全天参考<b id="previewDaily">1800ml</b></div>
          <div>上班目标<b id="previewWork">1000ml</b></div>
          <div>计划杯数<b id="previewCups">5杯</b></div>
          <div>催水间隔<b id="previewInterval">45分钟</b></div>
        </div>
        <div class="inline-error" id="setupError"></div>
        <div class="setup-actions">
          <button class="btn btn-ghost setup-back" id="setupBack">上一步</button>
          <button class="btn btn-primary setup-submit" id="setupSubmit">保存课表，开始补水</button>
        </div>
      </div>
      <div class="disclaimer">体重 × 30ml 为简易参考公式；天气、运动量及健康状况会影响实际需要。</div>
    </div>
  </section>
</div>
<script src="copy.js"></script>
<script src="../lib/hydration.js"></script>
<script src="sound.js"></script>
<script src="index.js"></script>
</body>
</html>
