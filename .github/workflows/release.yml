name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must use the stable v1.2.3 format."
          }

          $version = $tag.Substring(1)
          $packageVersion = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Tag version $version does not match package version $packageVersion."
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch origin/main for release validation.'
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$tag' is not attached to a commit on main."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows portable app
        run: npm run pack:win

      - name: Verify portable package
        run: npm run verify:win

      - name: Verify packaged Electron flows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.shots', '.shot-data' | Out-Null
          $env:SHOT = '1'
          $env:SHOT_DIR = (Resolve-Path '.shots').Path
          $env:SHOT_DATA_DIR = (Resolve-Path '.shot-data').Path
          $shotProcess = Start-Process `
            -FilePath 'dist/GokuGoku-win32-x64/GokuGoku.exe' `
            -PassThru -Wait -NoNewWindow
          if ($shotProcess.ExitCode -ne 0) {
            throw "Packaged Electron acceptance exited with $($shotProcess.ExitCode)."
          }
          npm run verify:shots

      - name: Prepare release asset
        id: asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $sourceDir = 'dist/GokuGoku-win32-x64'
          $exePath = Join-Path $sourceDir 'GokuGoku.exe'
          if (-not (Test-Path $exePath)) {
            throw 'Windows portable build did not create GokuGoku.exe.'
          }

          $productVersion = (Get-Item $exePath).VersionInfo.ProductVersion
          $expectedVersion = "^$([regex]::Escape($version))(?:\.0)?$"
          if ($productVersion -notmatch $expectedVersion) {
            throw "Executable product version $productVersion does not match release version $version."
          }

          $portableName = "GokuGoku-v$version-Windows-x64"
          $portableDir = Join-Path 'dist' $portableName
          $archivePath = Join-Path 'dist' "$portableName.zip"
          Move-Item -LiteralPath $sourceDir -Destination $portableDir
          tar.exe -a -c -f $archivePath -C 'dist' $portableName
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the portable ZIP.'
          }
          $archiveSize = (Get-Item $archivePath).Length
          if ($archiveSize -gt 160MB) {
            throw "Portable ZIP exceeds 160 MiB: $archiveSize bytes."
          }
          "path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ steps.asset.outputs.path }}
        run: |
          gh release create $env:RELEASE_TAG $env:RELEASE_ASSET `
            --verify-tag `
            --generate-notes `
            --title "GokuGoku $env:RELEASE_TAG"
